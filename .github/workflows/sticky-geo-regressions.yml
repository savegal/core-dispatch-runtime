name: Sticky proxy and account region regressions

on:
  pull_request:
    paths:
      - "config/settings.py"
      - "services/proxy_assignment_service.py"
      - "services/proxy_normalizer.py"
      - "services/geo_detection_service.py"
      - "services/cookie_validator.py"
      - "executor/http/playwright_http_client.py"
      - "tests/test_request_budget_defaults.py"
      - "tests/test_sticky_proxy_patch.py"
      - "tests/test_sticky_rebalance_policy.py"
      - "tests/test_trusted_country_sources.py"
      - "tests/test_cookie_curl_fallback_patch.py"
      - ".github/workflows/sticky-geo-regressions.yml"
  push:
    branches:
      - main
      - fix/sticky-http-first-patch-20261102

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # Disposable test-only values; never used by a deployed executor.
      EXECUTOR_API_TOKEN: "isolated-ci-executor-token-value-2026"
      JWT_SECRET: "isolated-ci-jwt-value-for-unit-tests-2026"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "fakeredis[lua]"
      - name: Compile changed modules
        run: |
          python -m compileall -q services/geo_detection_service.py services/proxy_normalizer.py services/proxy_assignment_service.py services/cookie_validator.py services/execution_attempts.py executor/http/playwright_http_client.py executor/http/mentions.py executor/browser_pool.py executor/engagement_engine.py executor/user_schema.py
      - name: Run focused regression tests without live network or browsers
        run: |
          python -m pytest -q tests/test_sticky_proxy_patch.py tests/test_sticky_rebalance_policy.py tests/test_trusted_country_sources.py tests/test_cookie_curl_fallback_patch.py tests/test_request_budget_defaults.py tests/unit/test_http_final_audit.py tests/test_shared_browser_and_asset_cache.py tests/unit/test_mentions.py tests/unit/test_http_proxy_release_fixes.py tests/unit/test_browser_pool_page_reuse.py tests/unit/test_partial_reply_resume.py tests/unit/test_engagement_engine_runtime.py tests/unit/test_reply_matrix_dedup.py tests/unit/test_http_order_modes.py tests/unit/test_reply_publication_visibility.py
