name: Sticky proxy and account region regressions

on:
  pull_request:
    paths:
      - "config/settings.py"
      - "services/proxy_assignment_service.py"
      - "services/proxy_normalizer.py"
      - "services/geo_detection_service.py"
      - "services/cookie_validator.py"
      - "services/residential_proxy_service.py"
      - "executor/http/playwright_http_client.py"
      - "executor/visibility_publisher.py"
      - "executor/quantity_engine.py"
      - "tests/unit/test_quantity_signed_bootstrap.py"
      - "tests/unit/test_quantity_proxy_failure_backoff.py"
      - "tests/test_request_budget_defaults.py"
      - "tests/test_sticky_proxy_patch.py"
      - "tests/test_sticky_rebalance_policy.py"
      - "tests/test_trusted_country_sources.py"
      - "tests/test_cookie_curl_fallback_patch.py"
      - ".github/workflows/sticky-geo-regressions.yml"
  push:
    branches:
      - main
      - fix/sticky-http-first-patch-20261102

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      # Disposable test-only values; never used by a deployed executor.
      EXECUTOR_API_TOKEN: "isolated-ci-executor-token-value-2026"
      JWT_SECRET: "isolated-ci-jwt-value-for-unit-tests-2026"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt fakeredis
      - name: Compile changed modules
        run: |
          python -m compileall -q services/geo_detection_service.py services/proxy_normalizer.py services/proxy_assignment_service.py services/cookie_validator.py services/residential_proxy_service.py executor/http/playwright_http_client.py executor/visibility_publisher.py executor/quantity_engine.py tests/unit/test_quantity_signed_bootstrap.py tests/unit/test_quantity_proxy_failure_backoff.py
      - name: Run focused regression tests without live network or browsers
        run: |
          python -m pytest -q \
            tests/test_sticky_proxy_patch.py \
            tests/test_sticky_rebalance_policy.py \
            tests/test_trusted_country_sources.py \
            tests/test_cookie_curl_fallback_patch.py \
            tests/test_request_budget_defaults.py \
            tests/unit/test_quantity_signed_bootstrap.py \
            tests/unit/test_quantity_proxy_failure_backoff.py \
            tests/unit/test_http_warmup_recovery.py \
            tests/unit/test_http_initialization.py \
            tests/unit/test_quantity_redesign_recovery.py \
            tests/unit/test_residential_proxy_policy.py \
            tests/unit/test_http_proxy_release_fixes.py \
            tests/unit/test_publication_observability.py \
            tests/unit/test_quantity_orders.py
